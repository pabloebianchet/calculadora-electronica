<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora Electrónica Completa</title>
    <style>
      :root {
        --bg1: #00566e;
        --bg2: #203a43;
        --bg3: #2c5364;
        --accent: #b5c7cc;
        --text: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
        margin: 0;
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1.5rem;
        height: auto;
        min-height: 0;
        background-attachment: fixed;
      }

      h1 {
        color: white;
        text-align: center;
        font-size: clamp(1.2rem, 4vw, 2rem);
      }

      .calculator {
        background: #00566e;
        backdrop-filter: blur(8px);
        border-radius: 16px;
        /* box-shadow: 0 0 20px rgba(0, 255, 157, 0.2); */
        padding: 1.5rem;
        max-width: 700px;
        width: 100%;
        margin-top: 1rem;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        padding-bottom: 0.5rem;
      }

      .tab {
        padding: 0.6rem 1rem;
        cursor: pointer;
        color: var(--text);
        transition: 0.3s;
        font-size: 0.9rem;
        border-radius: 6px;
      }

      .tab.active {
        border-bottom: 2px solid var(--accent);
        color: var(--accent);
        font-weight: 600;
      }

      .section {
        display: none;
        margin-top: 1.2rem;
      }
      .section.active {
        display: block;
      }

      label {
        display: block;
        margin-top: 0.6rem;
        font-size: 0.95rem;
      }

      input,
      select {
        width: 100%;
        padding: 0.6rem;
        margin-top: 0.3rem;
        border-radius: 6px;
        border: none;
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
        font-size: 1rem;
      }

      button {
        background: var(--accent);
        border: none;
        border-radius: 6px;
        color: #000;
        font-weight: bold;
        padding: 0.8rem;
        margin-top: 1rem;
        cursor: pointer;
        transition: 0.2s;
        width: 100%;
        font-size: 1rem;
      }
      button:hover {
        background: #00cc7a;
      }

      .result {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 8px;
        padding: 1rem;
        text-align: center;
        margin-top: 1rem;
        font-weight: 500;
        word-wrap: break-word;
      }

      .band-row {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1rem;
      }

      .band-row select {
        flex: 1;
        min-width: 90px;
      }

      @media (max-width: 600px) {
        body {
          padding: 1rem;
        }
        .calculator {
          padding: 1rem;
        }
        .tab {
          flex: 1 1 45%;
          text-align: center;
          padding: 0.5rem;
          font-size: 0.85rem;
        }
        input,
        select,
        button {
          font-size: 0.95rem;
        }
      }
    </style>
  </head>
  <body>
    <h1>Calculadora Electrónica Completa</h1>
    <div class="calculator">
      <div class="tabs">
        <div class="tab active" data-target="ohm">Ley de Ohm</div>
        <div class="tab" data-target="potencia">Potencia</div>
        <div class="tab" data-target="divisor">Divisor</div>
        <div class="tab" data-target="resistencias">Resistencias</div>
        <div class="tab" data-target="colores">Código de Colores</div>
      </div>

      <!-- Ley de Ohm -->
<div id="ohm" class="section active">
  <label>Qué querés calcular:</label>
  <select id="tipoOhm">
    <option value="V">Voltaje (V)</option>
    <option value="I">Corriente (A)</option>
    <option value="R">Resistencia (Ω)</option>
  </select>
  <input type="number" id="ohmA" placeholder="Valor 1" />
  <input type="number" id="ohmB" placeholder="Valor 2" />
  <button onclick="calcOhm()">Calcular</button>
  <div
    id="img-ohm-container"
    style="text-align: center; margin-top: 15px"
  >
    <img
      id="img-ohm"
      src="./ohm.png"
      alt="Diagrama Ley de Ohm"
      style="max-width: 250px; width: 100%; filter: brightness(0.95)"
    />
  </div>
  <div class="result" id="resOhm"></div>
</div>

<!-- Potencia -->
<div id="potencia" class="section">
  <label>Seleccioná fórmula:</label>
  <select id="tipoP">
    <option value="VI">P = V × I</option>
    <option value="V2R">P = V² / R</option>
    <option value="I2R">P = I² × R</option>
  </select>
  <input type="number" id="pA" placeholder="Valor 1" />
  <input type="number" id="pB" placeholder="Valor 2" />
  <button onclick="calcP()">Calcular Potencia</button>
  <div
    id="img-potencia-container"
    style="text-align: center; margin-top: 15px"
  >
    <img
      id="img-potencia"
      src="./potencia.png"
      alt="Diagrama de Potencia Eléctrica"
      style="max-width: 250px; width: 100%; filter: brightness(0.95)"
    />
  </div>
  <div class="result" id="resP"></div>
</div>

<!-- Divisor -->
<div id="divisor" class="section">
  <label>Tipo de divisor:</label>
  <select id="tipoDiv">
    <option value="tension">Tensión</option>
    <option value="corriente">Corriente</option>
  </select>
  <input type="number" id="vTotal" placeholder="Voltaje total (V)" />
  <input type="number" id="r1" placeholder="R1 (Ω)" />
  <input type="number" id="r2" placeholder="R2 (Ω)" />
  <button onclick="calcDiv()">Calcular</button>
  <div
    id="img-divisor-container"
    style="text-align: center; margin-top: 15px"
  >
    <img
      id="img-divisor"
      src="./divisor.png"
      alt="Diagrama de Divisor de Tensión"
      style="max-width: 250px; width: 100%; filter: brightness(0.95)"
    />
  </div>
  <div class="result" id="resDiv"></div>
</div>

<!-- Resistencias -->
<div id="resistencias" class="section">
  <label>Tipo de conexión:</label>
  <select id="tipoR">
    <option value="serie">Serie</option>
    <option value="paralelo">Paralelo</option>
  </select>
  <input type="text" id="valoresR" placeholder="Ej: 100,220,330" />
  <button onclick="calcRes()">Calcular</button>
  <div
    id="img-resistencias-container"
    style="text-align: center; margin-top: 15px"
  >
    <img
      id="img-resistencias"
      src="./resistencia.png"
      alt="Resistencias en Serie o Paralelo"
      style="max-width: 250px; width: 100%; filter: brightness(0.95)"
    />
  </div>
  <div class="result" id="resR"></div>
</div>

<!-- Código de Colores -->
<div id="colores" class="section">
  <label>Cantidad de bandas:</label>
  <select id="numBandas" onchange="renderBandas()">
    <option style="background-color: #e9ecf0; color: #000" value="4">
      4 Bandas
    </option>
    <option style="background-color: #e9ecf0; color: #000" value="5">
      5 Bandas
    </option>
    <option style="background-color: #e9ecf0; color: #000" value="6">
      6 Bandas
    </option>
  </select>

  
  <div class="band-row" id="bandInputs"></div>
  <button onclick="calcColor()">Calcular Valor</button>
  <div
    id="resistor-container"
    style="text-align: center; margin-top: 15px"
  >
    <img
      id="resistor-img"
      src="./bandas.png"
      alt="Resistencia con bandas"
      style="max-width: 250px; width: 100%; filter: brightness(0.95)"
    />
    <div id="band-overlay" style="position: relative; top: -100px"></div>
  </div>
  <div class="result" id="resColor"></div>
  
</div>


    <div style="text-align: center; margin-top: 20px">
      <a
        href="https://cdelectronicaargentina.mitiendanube.com/"
        target="_blank"
        rel="noopener noreferrer"
        style="
          display: inline-block;
          background-color: #335d97;
          color: #fff;
          padding: 10px 20px;
          border-radius: 6px;
          text-decoration: none;
          font-family: Arial, sans-serif;
          font-weight: bold;
        "
      >
        Ir a la tienda
      </a>
    </div>

    <script>
      const tabs = document.querySelectorAll(".tab");
      const sections = document.querySelectorAll(".section");

      tabs.forEach((t) => {
        t.addEventListener("click", () => {
          tabs.forEach((tab) => tab.classList.remove("active"));
          t.classList.add("active");
          const target = t.getAttribute("data-target");
          sections.forEach((s) => s.classList.remove("active"));
          document.getElementById(target).classList.add("active");
        });
      });

      function calcOhm() {
        const tipo = document.getElementById("tipoOhm").value;
        const a = parseFloat(document.getElementById("ohmA").value);
        const b = parseFloat(document.getElementById("ohmB").value);
        const res = document.getElementById("resOhm");
        if (isNaN(a) || isNaN(b))
          return (res.innerHTML = "Ingresá valores válidos");
        let r = 0;
        if (tipo === "V") r = a * b;
        else if (tipo === "I") r = a / b;
        else r = a / b;
        res.innerHTML =
          tipo === "V"
            ? `Voltaje = ${r.toFixed(3)} V`
            : tipo === "I"
            ? `Corriente = ${r.toFixed(3)} A`
            : `Resistencia = ${r.toFixed(3)} Ω`;
      }

      function calcP() {
        const tipo = document.getElementById("tipoP").value;
        const a = parseFloat(document.getElementById("pA").value);
        const b = parseFloat(document.getElementById("pB").value);
        const res = document.getElementById("resP");
        if (isNaN(a) || isNaN(b))
          return (res.innerHTML = "Ingresá valores válidos");
        let p = 0;
        if (tipo === "VI") p = a * b;
        else if (tipo === "V2R") p = (a * a) / b;
        else p = a * a * b;
        res.innerHTML = `Potencia = ${p.toFixed(3)} W`;
      }

      function calcDiv() {
        const tipo = document.getElementById("tipoDiv").value;
        const vt = parseFloat(document.getElementById("vTotal").value);
        const r1 = parseFloat(document.getElementById("r1").value);
        const r2 = parseFloat(document.getElementById("r2").value);
        const res = document.getElementById("resDiv");
        if (isNaN(vt) || isNaN(r1) || isNaN(r2))
          return (res.innerHTML = "Ingresá valores válidos");
        let v1, v2;
        if (tipo === "tension") {
          v1 = vt * (r1 / (r1 + r2));
          v2 = vt * (r2 / (r1 + r2));
          res.innerHTML = `V1 = ${v1.toFixed(3)} V<br>V2 = ${v2.toFixed(3)} V`;
        } else {
          const iTotal = vt / (r1 + r2);
          const i1 = iTotal * (r2 / (r1 + r2));
          const i2 = iTotal * (r1 / (r1 + r2));
          res.innerHTML = `I1 = ${i1.toFixed(3)} A<br>I2 = ${i2.toFixed(3)} A`;
        }
      }

      function calcRes() {
        const tipo = document.getElementById("tipoR").value;
        const valores = document
          .getElementById("valoresR")
          .value.split(",")
          .map(Number);
        const res = document.getElementById("resR");
        if (valores.some(isNaN))
          return (res.innerHTML =
            "Ingresá valores válidos (separados por coma)");
        let total = 0;
        if (tipo === "serie") total = valores.reduce((a, b) => a + b, 0);
        else total = 1 / valores.reduce((a, b) => a + 1 / b, 0);
        res.innerHTML = `Resistencia Equivalente = ${total.toFixed(3)} Ω`;
      }

      // === CÓDIGO DE COLORES ===
      const colores = [
        { nombre: "Negro", valor: 0, mult: 1, tol: null },
        { nombre: "Marrón", valor: 1, mult: 10, tol: 1 },
        { nombre: "Rojo", valor: 2, mult: 100, tol: 2 },
        { nombre: "Naranja", valor: 3, mult: 1000, tol: null },
        { nombre: "Amarillo", valor: 4, mult: 10000, tol: null },
        { nombre: "Verde", valor: 5, mult: 100000, tol: 0.5 },
        { nombre: "Azul", valor: 6, mult: 1000000, tol: 0.25 },
        { nombre: "Violeta", valor: 7, mult: 10000000, tol: 0.1 },
        { nombre: "Gris", valor: 8, mult: 100000000, tol: 0.05 },
        { nombre: "Blanco", valor: 9, mult: 1000000000, tol: null },
        { nombre: "Dorado", valor: null, mult: 0.1, tol: 5 },
        { nombre: "Plateado", valor: null, mult: 0.01, tol: 10 },
      ];

      function renderBandas() {
        const num = parseInt(document.getElementById("numBandas").value);
        const container = document.getElementById("bandInputs");
        container.innerHTML = "";

        const labels =
          num === 4
            ? ["1ª", "2ª", "Multiplicador", "Tolerancia"]
            : num === 5
            ? ["1ª", "2ª", "3ª", "Multiplicador", "Tolerancia"]
            : ["1ª", "2ª", "3ª", "Multiplicador", "Tolerancia", "Coef. Temp."];

        const colorMap = {
          Negro: "rgba(0, 0, 0, 0.7)",
          Marrón: "rgba(139, 69, 19, 0.7)",
          Rojo: "rgba(255, 0, 0, 0.7)",
          Naranja: "rgba(255, 165, 0, 0.7)",
          Amarillo: "rgba(255, 255, 0, 0.7)",
          Verde: "rgba(0, 128, 0, 0.7)",
          Azul: "rgba(0, 0, 255, 0.7)",
          Violeta: "rgba(138, 43, 226, 0.7)",
          Gris: "rgba(128, 128, 128, 0.7)",
          Blanco: "rgba(255, 255, 255, 0.7)",
          Dorado: "rgba(218, 165, 32, 0.7)",
          Plateado: "rgba(192, 192, 192, 0.7)",
        };

        labels.forEach((lab, i) => {
          const sel = document.createElement("select");
          sel.id = "banda" + i;
          sel.style.transition = "background-color 0.3s ease";

          colores.forEach((c) => {
            const opt = document.createElement("option");
            opt.value = c.nombre;
            opt.textContent = c.nombre;

            const bg = colorMap[c.nombre];
            opt.style.backgroundColor = bg;
            opt.style.color = ["Amarillo", "Blanco", "Plateado"].includes(
              c.nombre
            )
              ? "#000"
              : "#fff";

            sel.appendChild(opt);
          });

          // Al cambiar, se actualiza el color del fondo con transparencia
          sel.addEventListener("change", (e) => {
            const selected = e.target.value;
            const bg = colorMap[selected];
            e.target.style.backgroundColor = bg;
            e.target.style.color = ["Amarillo", "Blanco", "Plateado"].includes(
              selected
            )
              ? "#000"
              : "#fff";
          });

          container.appendChild(sel);
        });
      }

      function updateResistorBands() {
        const num = parseInt(document.getElementById("numBandas").value);
        const container = document.getElementById("band-overlay");
        container.innerHTML = "";

        const selectedColors = [];
        for (let i = 0; i < num; i++) {
          const sel = document.getElementById("banda" + i);
          if (sel) selectedColors.push(sel.value);
        }

        const colorMap = {
          Negro: "#000000",
          Marrón: "#8B4513",
          Rojo: "#FF0000",
          Naranja: "#FFA500",
          Amarillo: "#FFFF00",
          Verde: "#008000",
          Azul: "#0000FF",
          Violeta: "#8A2BE2",
          Gris: "#808080",
          Blanco: "#FFFFFF",
          Dorado: "#DAA520",
          Plateado: "#C0C0C0",
        };

        // Crear bandas visuales sobre la resistencia
        selectedColors.forEach((color, index) => {
          const band = document.createElement("div");
          band.style.display = "inline-block";
          band.style.width = "10px";
          band.style.height = "60px";
          band.style.margin = "0 5px";
          band.style.backgroundColor = colorMap[color] || "transparent";
          band.style.borderRadius = "2px";
          band.style.opacity = "0.8";
          container.appendChild(band);
        });
      }

      function calcColor() {
        const num = parseInt(document.getElementById("numBandas").value);
        const res = document.getElementById("resColor");

        const valores = [];
        const seleccionados = [];
        for (let i = 0; i < num; i++) {
          seleccionados.push(document.getElementById("banda" + i).value);
          const color = colores.find((c) => c.nombre === seleccionados[i]);
          valores.push(color);
        }

        let resistencia = 0;
        if (num === 4) {
          const base = valores[0].valor * 10 + valores[1].valor;
          resistencia = base * valores[2].mult;
          res.innerHTML = `${resistencia.toLocaleString()} Ω ±${
            valores[3].tol || 0
          }%`;
        } else if (num === 5) {
          const base =
            valores[0].valor * 100 + valores[1].valor * 10 + valores[2].valor;
          resistencia = base * valores[3].mult;
          res.innerHTML = `${resistencia.toLocaleString()} Ω ±${
            valores[4].tol || 0
          }%`;
        } else {
          const base =
            valores[0].valor * 100 + valores[1].valor * 10 + valores[2].valor;
          resistencia = base * valores[3].mult;
          res.innerHTML = `${resistencia.toLocaleString()} Ω ±${
            valores[4].tol || 0
          }%`;
        }
      }

      renderBandas();
    </script>
